<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#2b1554"/>
      <stop offset=".5" stop-color="#110c27"/>
      <stop offset="1" stop-color="#060613"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" x2="1">
      <stop offset="0" stop-color="#b12083" stop-opacity="0"/>
      <stop offset=".14" stop-color="#d64066"/>
      <stop offset=".42" stop-color="#ffdca6"/>
      <stop offset=".62" stop-color="#fff4e2"/>
      <stop offset=".86" stop-color="#e1ac6e"/>
      <stop offset="1" stop-color="#b12083" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4e2"/>
      <stop offset=".35" stop-color="#ffcf8a"/>
      <stop offset=".75" stop-color="#e1ac6e"/>
      <stop offset="1" stop-color="#d64066" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="bloom">
      <stop offset=".45" stop-color="#e1ac6e" stop-opacity=".28"/>
      <stop offset=".7" stop-color="#d64066" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d64066" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12.0"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#space)"/>
  <g fill="#fff">
    <circle cx="92" cy="104" r="2.2" opacity=".8"/><circle cx="410" cy="88" r="1.6" opacity=".6"/>
    <circle cx="438" cy="396" r="2" opacity=".7"/><circle cx="70" cy="380" r="1.4" opacity=".5"/>
    <circle cx="352" cy="58" r="1.2" opacity=".5"/><circle cx="150" cy="452" r="1.6" opacity=".6"/>
  </g>
  <g transform="translate(256 256) scale(1.0) translate(-256 -256)">
    <!-- light bent around the hole: a soft amber bloom -->
    <circle cx="256" cy="256" r="200" fill="url(#bloom)"/>
    <g transform="rotate(-10 256 256)">
      <!-- far side of the disk, mostly hidden behind the corona -->
      <ellipse cx="256" cy="256" rx="226" ry="34" fill="none" stroke="url(#disk)" stroke-width="12.0" opacity=".7"/>
    </g>
    <!-- lensed image of the disk's far side, hugging the shadow -->
    <circle cx="256" cy="256" r="114" fill="none" stroke="url(#halo)" stroke-width="34.0" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="url(#halo)" stroke-width="16.0"/>
    <!-- event horizon -->
    <circle cx="256" cy="256" r="100" fill="#000"/>
    <g transform="rotate(-10 256 256)">
      <!-- near side of the disk, crossing in front of the shadow -->
      <path d="M30 256 A226 34 0 0 0 482 256" fill="none" stroke="url(#disk)" stroke-width="40.0" filter="url(#glow)" opacity=".75"/>
      <path d="M30 256 A226 34 0 0 0 482 256" fill="none" stroke="url(#disk)" stroke-width="16.0"/>
      <path d="M70 256 A186 26 0 0 0 442 256" fill="none" stroke="#fff8ec" stroke-width="3.0" opacity=".85"/>
    </g>
  </g>
</svg>
